<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Aistim Tool</h1>
    <div class="subtitle">Userscript Manager</div>

    <div class="status-box">
      <span class="status-dot"></span>
      <span class="status-text">Sudah jalan</span>
    </div>

    <div class="page-info">
      <div class="page-label">Halaman saat ini:</div>
      <div class="page-value" id="page-value">Memeriksa...</div>
    </div>

    <div class="section-title">Script dari URL</div>

    <div class="url-box">
      <label>URL Raw GitHub</label>
      <input type="text" id="inp-url" placeholder="https://raw.githubusercontent.com/.../script.js">

      <label>Match Pattern</label>
      <input type="text" id="inp-match" placeholder="https://example.com/*">

      <div class="toggle-row">
        <span>Aktifkan script</span>
        <div class="toggle-switch on" id="toggle-enabled"></div>
      </div>

      <div class="btn-row-url">
        <button class="btn-save-url" id="btn-save-url">💾 Simpan</button>
        <button class="btn-run-url" id="btn-run-url">▶ Load & Run</button>
      </div>
    </div>

    <div class="script-status" id="script-status">Memuat status...</div>

    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
