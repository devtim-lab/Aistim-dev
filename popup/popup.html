<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Aistim Tool</h1>
    <div class="subtitle">Userscript Manager</div>

    <div class="status-box">
      <span class="status-dot"></span>
      <span class="status-text">Sudah jalan</span>
    </div>

    <div class="page-info">
      <div class="page-label">Halaman saat ini:</div>
      <div class="page-value" id="page-value">Memeriksa...</div>
    </div>

    <div class="section-title">Userscripts Aktif</div>
    <div class="script-list" id="script-list">
      <div class="empty">Memuat...</div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="btn-run">&#9658; Jalankan di Tab Ini</button>
    </div>
    <div class="btn-row-2">
      <button class="btn-secondary" id="btn-add">+ Tambah</button>
      <button class="btn-secondary" id="btn-refresh">&#8635; Refresh</button>
    </div>

    <div id="status"></div>
  </div>

  <!-- Modal Tambah/Edit -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3 id="modal-title">Tambah Userscript</h3>
      <label>Nama</label>
      <input type="text" id="inp-name" placeholder="Nama userscript">
      <label>Match URL</label>
      <input type="text" id="inp-match" placeholder="https://example.com/*">
      <label>Kode JavaScript</label>
      <textarea id="inp-code" placeholder="(function() { ... })();"></textarea>
      <div class="modal-btns">
        <button class="btn-cancel" id="btn-cancel">Batal</button>
        <button class="btn-save" id="btn-save">Simpan</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
