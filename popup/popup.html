<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Aistim Tool</h1>
    <div class="subtitle">Multi Userscript Manager</div>

    <div class="status-box">
      <span class="status-dot"></span>
      <span class="status-text">Sudah jalan</span>
    </div>

    <div class="version-row">
      <span class="version-label" id="version-label">v?</span>
      <button class="btn-update" id="btn-update" title="Cek versi terbaru di GitHub">🔄 Cek Update</button>
    </div>
    <div class="engine-label" id="engine-label">Engine: memeriksa...</div>
    <div class="update-bar" id="update-bar" style="display:none;">
      <span>🎉 Versi baru: <b id="update-version"></b></span>
      <a id="update-link" href="https://github.com/devtim-lab/Aistim-dev/archive/refs/heads/main.zip" target="_blank">⬇ Download</a>
    </div>
    <div class="update-steps" id="update-steps" style="display:none;">
      Cara update: 1) Klik ⬇ Download 2) Ekstrak ZIP, timpa folder lama 3) Buka chrome://extensions → klik 🔄 pada Aistim Tool
    </div>

    <div class="page-info">
      <div class="page-label">Halaman saat ini:</div>
      <div class="page-value" id="page-value">Memeriksa...</div>
    </div>

    <div class="section-title">Daftar Scripts <span><span id="script-count">(0)</span> <button class="btn-resync" id="btn-resync" title="Tarik ulang daftar script dari GitHub">🔄</button></span></div>
    <div class="script-list" id="script-list">
      <div class="empty">Memuat...</div>
    </div>

    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
