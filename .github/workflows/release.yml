name: Release

# Otomatis bikin tag + release saat version di manifest.json naik.
# ZIP release otomatis bernama Aistim-dev-<versi>.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP and create/update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          TAG="v$VERSION"
          ZIPNAME="Aistim-dev-$VERSION.zip"
          echo "Version di manifest: $VERSION (tag: $TAG)"

          mkdir -p /tmp/build/Aistim-dev
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' ./ /tmp/build/Aistim-dev/
          (cd /tmp/build && zip -r "$ZIPNAME" Aistim-dev)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada — pastikan asset ZIP ter-upload"
            gh release upload "$TAG" "/tmp/build/$ZIPNAME" --clobber
            echo "Asset $ZIPNAME diupload/diupdate ke release $TAG"
          else
            gh release create "$TAG" "/tmp/build/$ZIPNAME" \
              --title "Aistim Tool v$VERSION" \
              --notes "Lihat README.md untuk changelog lengkap." \
              --latest
            echo "Release $TAG dibuat dengan asset $ZIPNAME"
          fi
